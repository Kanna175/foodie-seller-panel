# ---------- Server ----------
server.port=8080
spring.application.name=foodie-seller-core

# ---------- MySQL (database: foodie_db) ----------
# createDatabaseIfNotExist=true lets the app create foodie_db on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/foodie_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" is convenient for development. Use "validate" + Flyway/Liquibase in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Foodie settings ----------
# Shared secret the Node gateway sends in the X-Internal-Key header.
# Requests to /api/** without it are rejected, so only the gateway can call this service.
foodie.internal-key=${INTERNAL_KEY:foodie-internal-dev-key}
# Seeds the demo seller (demo@foodie.in / demo123) with menu, orders and payouts on an empty DB.
foodie.seed-demo-data=${SEED_DEMO_DATA:true}
# Enables POST /api/seller/{id}/orders/simulate (creates a fake incoming order for testing).
foodie.demo-endpoints=${DEMO_ENDPOINTS:true}
